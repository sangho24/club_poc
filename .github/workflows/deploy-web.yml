name: Deploy Web Demo

# 목적: main 에 push 되면 웹 데모를 GitHub Pages 에 자동 배포한다.
# 시연 담당자에게 "링크 하나"만 보내면 되는 상태를 유지하는 것이 목적이다
# (앱 설치·Expo Go·같은 네트워크 전부 불필요).
#
# 최초 1회 설정 필요: Settings > Pages > Source 를 "GitHub Actions" 로 변경.
# 배포 주소: https://sangho24.github.io/club_poc/

on:
  push:
    branches: [main]
  workflow_dispatch: # 수동 실행 허용 (시연 직전 재배포용)

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 취소하지 않고 순차 처리한다 (중간 상태로 덮이는 것 방지).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 정적 빌드
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: Node 설치
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입체크
        run: npx tsc --noEmit

      # 파생 지표(wOBA·wRC+·WAR·FIP)와 확률 엔진의 자체 검증.
      # 화면보다 먼저 돌리는 것이 이 저장소의 규칙이라 배포 경로에도 넣는다.
      - name: 지표·엔진 검증
        run: npx tsc -p tools/tsconfig.verify.json && node .tmp/tools/verify-stats.js

      # GitHub Pages 프로젝트 사이트는 /<저장소명>/ 하위 경로로 서빙되므로
      # 에셋 경로에 그 접두사를 붙여야 한다 (안 붙이면 흰 화면).
      # app.json 에 상시로 넣어두면 네이티브 빌드에도 영향을 주므로 CI 에서만 주입한다.
      # EXPO_BASE_URL 환경변수는 동작하지 않는다 - experiments.baseUrl 만 먹는다 (실측).
      - name: Pages 서브경로 주입
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.experiments = { ...(cfg.expo.experiments || {}), baseUrl: process.env.BASE_URL };
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
            console.log('baseUrl =', cfg.expo.experiments.baseUrl);
          "

      - name: 웹 정적 빌드
        run: npx expo export --platform web

      # upload-pages-artifact 는 v3 를 유지한다 (composite 액션이라 Node 런타임 이슈 없음).
      # v4+ 는 숨김 파일을 기본 제외하므로 별도 옵션이 필요해진다.
      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Pages 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v5
